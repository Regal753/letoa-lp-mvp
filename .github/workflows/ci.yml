name: ci

on:
  pull_request:
  push:
    branches:
      - main
      - "codex/**"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npm run build:css
      - run: git diff --exit-code -- assets/tailwind.generated.css
      - run: node scripts/validate-static.mjs
